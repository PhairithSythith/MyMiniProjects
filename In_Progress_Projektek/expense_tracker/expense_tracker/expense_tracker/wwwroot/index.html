<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="jQuery.js" defer></script>
</head>
<body>

    <h1>Költségkövető</h1>

    <div id="aktEgyenleg3">Aktuális egyenleg</div>

    <div id="osszegTarolo">
        <div id="aktEgyenleg">0</div>
        <div id="aktEgyenleg2">FT</div>
    </div>

    <form id="koltsegForm">
        <fieldset>
            <legend>Hozzáadás:</legend>
            <input type="text" id="koltsegInput" placeholder="Költség neve">
            <select id="KiBeVmi"><option value="Bevétel">Bevétel</option><option value="Kiadás">Kiadás</option></select>
            <input type="number" id="osszegInput" placeholder="Összeg">
            <button type="submit">Hozzáad</button>
        </fieldset>
    </form>

    <div id="nTarolo">
        <div id="kiadas"><div id="k">Kiadások</div></div>
        <div id="bevetel"><div id="b">Bevételek</div></div>
    </div>

</body>
</html>
