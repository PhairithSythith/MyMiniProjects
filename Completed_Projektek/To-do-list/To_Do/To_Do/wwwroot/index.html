<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="jQuery.js" defer></script>
</head>
<body>
  <div id="tarolo">
    <h1 id="h1">
        My To-Do List
    </h1>

    <div id="datum"></div>

    <form id="feladatPlusz">
        <label for="feladat">Új feladat:</label>
        <input type="text" id="feladat" name="feladat" placeholder="Ide írd a feladatokat....">
        <button type="submit" id="hozzaAd">Hozzáad</button>
    </form>

    <div id="elorehaladas">
        <h2 id="ehSzoveg">Előrehaladás eddig:</h2>
        <div id="ehMutato"></div>
    </div>

    <div id="feladatokKnK">
        <div id="nincsKesz">
            <h2 id="nkSzoveg">Még el nem készült feladatok</h2>
            <ul id="nkLista"></ul>
        </div>

        <div id="kesz">
            <h2 id="kSzoveg">Kész feladatok</h2>
            <ul id="kLista"></ul>
        </div>
    </div>

    <div id="archiv">
        <h2 id="ahSzoveg">Előző feladatok gyűjteménye</h2>
        <div id="ahDoboz">
            <select id="mikor">
                <option value="">Válassz Dátumot</option>
            </select>
            <ul id="archLista"></ul>
        </div>
    </div>
   </div>
</body>
    </html>
